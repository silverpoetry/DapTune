name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Contract, test, lint and R8 build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Validate documentation and profile contract
        run: |
          npx --yes markdownlint-cli2@0.18.1 "*.md" "docs/**/*.md" "tools/**/*.md" ".github/**/*.md"
          node tools/validate-docs.mjs
          node tools/validate-profile-contract.mjs

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run verification
        run: >-
          ./gradlew --no-daemon
          testDebugUnitTest
          lintRelease
          :app:assembleRelease

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
